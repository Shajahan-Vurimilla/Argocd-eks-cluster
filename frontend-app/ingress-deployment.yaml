# nginx-frontend.yaml


apiVersion: v1
kind: Namespace
metadata:
  name: frontend

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-ingress-deployment
  namespace: frontend
  labels:
    app: app-1

spec:
  replicas: 3

  selector:
    matchLabels:
      app: app-1

  template:
    metadata:
      labels:
        app: app-1
        environment: dev

    spec:
      containers:
        - name: nginx
          image: nginx:1.28
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP


---
apiVersion: v1
kind: Service
metadata:
  name: app-1
  namespace: frontend
spec:
  type: ClusterIP
  selector:
    app: app-1
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP

